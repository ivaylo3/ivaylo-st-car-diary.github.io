name: Известия

on:
  schedule:
    # Целта е 11:00 българско време. GitHub работи по UTC и често закъснява или пропуска пускания,
    # затова има няколко резервни. Скриптът праща от 11:00 до 21:59 в София; телефонът показва всяко
    # напомняне само веднъж, така че следващите пускания за деня не показват нищо ново.
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'
    - cron: '7 11 * * *'
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Вид: daily (истинска проверка) или test (тестово известие)'
        required: true
        default: test
        type: choice
        options: [test, daily]

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/scripts/push.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_TYPE: ${{ github.event.inputs.type || 'daily' }}
          SITE_URL: https://ivaylo3.github.io/ivaylo-st-car-diary.github.io/
