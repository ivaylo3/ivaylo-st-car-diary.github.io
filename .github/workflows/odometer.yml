name: Километраж от MyŠkoda
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' && format('Километраж · синхронизация {0}', inputs.request_id) || 'Километраж от MyŠkoda' }}

on:
  schedule:
    # Цел: 8:30 българско време, до 4 опита до 9:00. GitHub често закъснява или пропуска пускания,
    # затова има резервни; ако километражът вече е взет днес, резервните не правят заявка към Škoda.
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
    - cron: '17 8 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Идентификатор от приложението (празно при ръчно пускане)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: odometer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Предишни данни
        run: git fetch -q --depth=1 origin odo-data && git show FETCH_HEAD:odo.json > "$RUNNER_TEMP/prev.json" || echo "Още няма предишни данни."
      - name: Заявка към MyŠkoda Public API
        run: node .github/scripts/odometer.mjs "$RUNNER_TEMP/odo.json" "$RUNNER_TEMP/prev.json"
        env:
          SKODA_API_KEY: ${{ secrets.SKODA_API_KEY }}
          SKODA_VIN: ${{ secrets.SKODA_VIN }}
          ODO_SECRET: ${{ secrets.ODO_SECRET }}
          ODO_MODE: ${{ github.event_name == 'schedule' && 'auto' || 'now' }}
          ODO_REQUEST: ${{ inputs.request_id }}
      - name: Публикуване на криптирания файл (клон odo-data, без история)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/odo.json" ] || { echo "Няма нов файл."; exit 0; }
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q -b odo-data
          cp ../odo.json odo.json
          git add odo.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Километраж (криптиран)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odo-data
          echo "Публикувано в клона odo-data."
