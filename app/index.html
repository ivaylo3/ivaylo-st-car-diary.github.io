<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Diary">
<meta name="description" content="Лична сервизна книжка за автомобил">
<meta name="robots" content="noindex,nofollow">
<title>Car Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Direction: calm car-app — big photo, white floating cards, one deep-green accent; Unbounded for names and numbers, Onest for everything else */
:root{
  --bg:#eef1f1;--surface:#ffffff;--sunk:#f2f5f4;--fg:#0f1a17;--muted:#63716c;--line:#e3e8e6;
  --accent:#0b6b4f;--accent-fg:#ffffff;--accent-soft:#e2f2eb;
  --ok:#1f8a5b;--ok-bg:#e3f4ea;--warn:#b26700;--warn-bg:#fdf0da;--bad:#c2372a;--bad-bg:#fbe2de;
  --shadow:0 1px 2px rgba(15,26,23,.05),0 10px 30px rgba(15,26,23,.07);
  --scrim:rgba(12,20,18,.42);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:24px;--r-md:18px;--r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b100f;--surface:#141b19;--sunk:#1b2321;--fg:#e8eeec;--muted:#93a29d;--line:#24302d;
  --accent:#4fd1a1;--accent-fg:#062018;--accent-soft:#143128;
  --ok:#6fd39c;--ok-bg:#15302a;--warn:#f2b45d;--warn-bg:#33270f;--bad:#ff8a7a;--bad-bg:#3a1c19;
  --shadow:0 0 0 1px #1f2a27;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b100f;--surface:#141b19;--sunk:#1b2321;--fg:#e8eeec;--muted:#93a29d;--line:#24302d;
  --accent:#4fd1a1;--accent-fg:#062018;--accent-soft:#143128;
  --ok:#6fd39c;--ok-bg:#15302a;--warn:#f2b45d;--warn-bg:#33270f;--bad:#ff8a7a;--bad-bg:#3a1c19;
  --shadow:0 0 0 1px #1f2a27;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:1.02rem;font-weight:600;letter-spacing:-.005em}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.82rem}
.foot{font-size:.78rem;color:var(--muted);max-width:65ch;margin:0}

/* hero */
.hero{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.hero-photo{width:100%;aspect-ratio:1000/630;background:var(--sunk) center/cover no-repeat;position:relative;display:grid;place-items:center}
@media (min-width:700px){
  .hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:center;gap:0 6px;padding:14px}
  .hero-photo{grid-row:1/3;border-radius:16px}
  .hero-card{flex-direction:column;align-items:flex-start;padding:6px 10px 4px 16px}
  .hero .save{padding:2px 10px 6px 16px;align-self:start}
}
.hero-card{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 20px;padding:18px 22px 6px}
.hero-id{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.15;letter-spacing:-.015em}
.vin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:2px}
.vin-l{font-size:.64rem;font-weight:700;letter-spacing:.09em;background:var(--sunk);padding:2px 6px;border-radius:5px}
.vin .num{letter-spacing:.05em;color:var(--fg);user-select:all}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:.82rem;cursor:pointer;padding:2px}
.odo-btn{border:0;background:var(--sunk);border-radius:var(--r-md);padding:12px 16px;display:grid;grid-template-columns:auto auto;align-items:baseline;gap:2px 14px;cursor:pointer;text-align:left}
.odo-btn:hover{background:var(--accent-soft)}
.odo-n{font-family:var(--f-display);font-weight:600;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums;grid-column:1}
.odo-n small{font-size:.8rem;font-weight:500;color:var(--muted)}
.odo-s{grid-column:1;font-size:.74rem;color:var(--muted)}
.odo-cta{grid-column:2;grid-row:1/3;align-self:center;font-size:.8rem;font-weight:600;color:var(--accent)}
.save{padding:0 22px 16px;font-size:.75rem;color:var(--muted)}
.save.warn{color:var(--warn)}

/* nav */
.tabs{display:flex;align-items:center;gap:14px;align-self:center;max-width:100%;flex-wrap:wrap;justify-content:center}
.tabs-main{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.tabs-sub{display:flex;gap:2px}
.tabs-sub .tab{font-size:.84rem;padding:8px 12px}
.tabs-sub .tab svg{width:16px;height:16px}
.tabs-sub .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);display:flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap;position:relative}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.badge{font-size:.68rem;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;background:var(--warn);color:#fff}
.badge.bad{background:var(--bad)}
@media (max-width:620px){
  .wrap{padding-bottom:110px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;flex-wrap:nowrap;align-items:stretch;gap:6px;background:var(--surface);border-radius:20px 20px 0 0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(0,0,0,.06)}
  .tabs-main{flex:2;background:none;box-shadow:none;padding:0;gap:4px}
  .tabs-sub{flex:1.3;gap:0;border-left:1px solid var(--line);padding-left:6px}
  .tabs-sub .tab{font-size:.62rem;padding:7px 4px}
  .tabs-sub .tab svg{width:18px;height:18px}
  .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:7px 10px;border-radius:14px;flex:1}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .tab .badge{position:absolute;top:2px;right:calc(50% - 22px)}
}

/* sections */
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.att{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:9px 12px 9px 9px;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.att:hover{background:var(--sunk)}
.ico.sm{width:32px;height:32px;border-radius:10px}
.att-t{display:flex;flex-direction:column;min-width:0}
.att-n{font-weight:600;font-size:.88rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-s{font-size:.72rem;color:var(--muted)}
.att-r{font-weight:700;font-size:.86rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-warn .att-r{color:var(--warn)}.s-bad .att-r,.s-bad .att-s{color:var(--bad)}
.cta-row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.cta.alt{background:var(--surface);color:var(--fg)}
.cta.alt .cta-ico{background:var(--sunk);color:var(--accent)}
.cta.alt small{color:var(--muted);opacity:1}
@media (max-width:620px){.cta-row{grid-template-columns:1fr}}
.dt{display:flex;flex-direction:column;gap:14px}
.dt-top{display:flex;align-items:center;gap:12px}
.dt-big{flex:1;min-width:0}
.dt-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-top:6px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:16px}
.tl li{position:relative;display:flex;flex-direction:column;gap:4px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl-d{display:flex;flex-direction:column}.tl-d b{font-weight:600}.tl-d span{font-size:.78rem;color:var(--muted)}
.tl-m{font-size:.84rem}
.tl-x{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.84rem;color:var(--muted)}
.tl .link{align-self:flex-start;padding:0}
.back-wrap{display:flex;flex-direction:column;gap:6px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);font-weight:600;font-size:.85rem;cursor:pointer;padding:0;align-self:flex-start}
.back svg{transform:rotate(180deg)}
.mon{font-family:var(--f-display);font-size:.9rem;font-weight:600;text-transform:capitalize;margin:10px 0 0;padding:0 6px}
.row-main.sch{grid-template-columns:38px 32px minmax(0,1fr) 16px}
.sch-d{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sch-d b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.sch-d span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.s-bad .sch-d b{color:var(--bad)}.s-warn .sch-d b{color:var(--warn)}
.tag.km{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);color:var(--fg)}
.odo-v{color:var(--fg);font-weight:600}
.hv.odo{padding-block:10px}
.tyres{display:flex;flex-direction:column;gap:8px}
.tyre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:10px 12px}
.tyre.old{opacity:.65}
.ty-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ty-acts{display:flex;gap:6px;flex-wrap:wrap}
.ty-form{margin-top:6px}
.md-ed{display:flex;gap:10px;flex-wrap:wrap}
.md-l{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);font-weight:600}
.md-l input{width:90px}
.stale{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--fg);border-radius:var(--r-md);padding:12px 14px;font-size:.86rem}
.stale svg{color:var(--warn);flex:none}.stale span{flex:1 1 220px}
.vers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vers li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:9px 12px}
.vers-t{display:flex;flex-direction:column;min-width:0}
.vers-t b{font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.hero-photo.empty{cursor:pointer;color:var(--muted);gap:8px;font-weight:600;font-size:.88rem;align-content:center;justify-items:center;border:2px dashed var(--line)}
.hero-photo.empty:hover{color:var(--accent);border-color:var(--accent)}
.hero-photo.has-img{overflow:hidden}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph-edit{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 11px;background:rgba(12,20,18,.62);color:#fff;font-weight:600;font-size:.76rem;cursor:pointer;backdrop-filter:blur(4px)}
.ph-edit:hover{background:rgba(12,20,18,.8)}
.pv-box{position:relative;width:100%;aspect-ratio:1000/630;border-radius:16px;overflow:hidden;background:var(--sunk);touch-action:none;cursor:grab;user-select:none}
.pv-box.drag{cursor:grabbing}
.pv-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pv-hint{position:absolute;left:10px;top:10px;display:inline-flex;gap:5px;align-items:center;font-size:.72rem;font-weight:600;color:#fff;background:rgba(12,20,18,.55);padding:4px 9px;border-radius:999px;pointer-events:none}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent);height:28px}
.stale.auth{background:var(--accent-soft)}.stale.auth svg{color:var(--accent)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:32px 26px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.login-card.wide{max-width:620px;text-align:left;align-items:stretch}
.login-card h1{font-family:var(--f-display);font-weight:600;font-size:1.6rem}
.login-card p{margin:0;color:var(--muted);line-height:1.55}
.login-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg)}
.gbtn{width:100%;text-align:center}
.ob{background:var(--sunk);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ob h2{font-size:.98rem}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.steps b{color:var(--fg)}
.file-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.primary.file-btn,.btn.primary.file-btn:hover{color:var(--accent-fg)}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.imp-sum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.imp-sum li{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.imp-sum b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.imp-sum span{font-size:.74rem;color:var(--muted)}
.imp-det summary{cursor:pointer;font-weight:600;font-size:.9rem;margin-bottom:8px}
.imp-det[open]{display:flex;flex-direction:column;gap:10px}
/* ---- design refresh ---- */
.cta-row{grid-template-columns:1fr 1fr}
.cta{min-height:84px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.cta-t{flex:1;min-width:0}
.cta-t b{font-size:.98rem}
.cta-go{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);flex:none}
.cta.alt{box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.cta.alt .cta-go{background:var(--sunk);color:var(--muted)}
@media (hover:hover){.cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(11,107,79,.22)}.cta.alt:hover{box-shadow:0 14px 34px rgba(0,0,0,.12),inset 0 0 0 1px var(--accent);filter:none}.att:hover,.row-main:hover{transform:translateY(-1px)}}
.att,.row-main{transition:transform .15s ease,background .15s ease}
.ring{--c:var(--ok);flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.s-warn .ring{--c:var(--warn)}.s-bad .ring{--c:var(--bad)}
.ring .ico.sm{width:32px;height:32px;border-radius:10px;background:var(--surface)}
.s-warn .ring .ico.sm{background:var(--warn-bg)}.s-bad .ring .ico.sm{background:var(--bad-bg)}
.att{grid-template-columns:38px minmax(0,1fr) auto}
.save{display:inline-flex;align-items:center;gap:7px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.save.warn::before{background:var(--warn)}
@media (min-width:700px){
  .hero{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-rows:1fr auto;align-items:stretch;gap:0 26px;padding:14px}
  .hero .hero-photo{grid-row:1/3;border-radius:16px;align-self:center}
  .hero .hero-card{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:center;gap:18px;padding:10px 10px 0 0}
  .hero .odo-btn{align-self:flex-start;min-width:280px}
  .hero .save{padding:0 10px 8px 0;align-self:end}
  .tabs{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:12;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);padding:5px;border-radius:999px;box-shadow:var(--shadow);gap:6px}
  .tabs-main{background:none;box-shadow:none;padding:0}
  .tabs-sub{padding-right:6px}
}
@media (max-width:620px){.cta-row{grid-template-columns:1fr}.cta{min-height:0}}
@media (prefers-reduced-motion:reduce){.cta,.att,.row-main{transition:none}.cta:hover,.att:hover,.row-main:hover{transform:none}}
.cta-row{grid-template-columns:1fr!important}
.cta-row .cta{min-height:0;padding:15px 18px}
.cta-row .cta-t small{opacity:.9}
.sec-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.nav-link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:.84rem;cursor:pointer}
.nav-link svg:last-child{transition:transform .15s}
.nav-link:hover svg:last-child{transform:translateX(3px)}
.nav-link:hover span{text-decoration:underline;text-underline-offset:3px}
.sched-card{display:flex;flex-direction:column;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.sched-card:hover{border-color:var(--accent)}
@media (hover:hover){.sched-card:hover{transform:translateY(-1px)}}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-t b{font-family:var(--f-display);font-weight:600;font-size:1rem}
.sc-t small{font-size:.8rem;color:var(--muted)}
.sc-go{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.85rem;color:var(--accent);background:var(--accent-soft);padding:7px 10px 7px 14px;border-radius:999px;white-space:nowrap}
.tline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}
.tline::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:2px;background:var(--line)}
.tp{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:20px}

function sortedReadings(){var rs=S.readings.slice();if(!rs.some(function(r){return r.km===0}))rs.push({d:S.car.purchase,km:0});return rs.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.km-b.km})}
function rate(){
  var rs=sortedReadings(),last=rs[rs.length-1];if(!last||last.km<=0)return null;
  var ws=addDays(last.d,-365),ref=rs[0];
  rs.forEach(function(r){if(r.d<=ws)ref=r});
  var d=days(ref.d,last.d),km=last.km-ref.km;if(d<=0||km<=0)return null;
  var PRIOR=15000/365,fill=Math.max(0,60-d);
  return (km+PRIOR*fill)/(d+fill);
}

function mdStr(md){var p=md.split('-');return p[1]+'.'+p[0]}
function computeMd(it){
  var logs=S.log.filter(function(l){return l.item===it.id}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var last=logs[logs.length-1],L=last?last.d:null,t=today(),P=S.car.purchase;
  function onOrBefore(x){var best=null;it.md.forEach(function(r){var y=+x.slice(0,4),o=y+'-'+r.d;if(o>x)o=(y-1)+'-'+r.d;if(!best||o>best.d)best={d:o,to:r.to}});return best}
  function after(x){var best=null;it.md.forEach(function(r){var y=+x.slice(0,4),o=y+'-'+r.d;if(o<=x)o=(y+1)+'-'+r.d;if(!best||o<best.d)best={d:o,to:r.to}});return best}
  var prev=onOrBefore(t),next=after(t),due;
  if(!prev||!next)return {last:last,dueKm:null,dueDate:null,remKm:null,dD:null,dK:null,eff:null,st:'ok',pct:0,md:true};
  var prevDone=(L&&L>=addDays(prev.d,-45))||prev.d<P;
  if(!prevDone&&days(prev.d,t)<=60)due=prev;
  else{due=next;if(L&&L>=addDays(next.d,-45))due=after(next.d)}
  var dD=days(t,due.d),st=dD<0?'bad':dD<=30?'warn':'ok',base=L||onOrBefore(addDays(due.d,-1)).d;
  return {last:last,dueKm:null,dueDate:due.d,remKm:null,dD:dD,dK:null,eff:dD,st:st,pct:clamp(days(base,t)/Math.max(1,days(base,due.d))),md:true,toSet:due.to,missed:due===prev};
}
function compute(it){
  if(it.md&&it.md.length)return computeMd(it);
  var logs=S.log.filter(function(l){return l.item===it.id}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.km-b.km});
  var last=logs[logs.length-1];
  var base=last?{d:last.d,km:last.km}:{d:S.car.purchase,km:0};
  var kmI=last?it.km:(it.firstKm||it.km),moI=last?it.mo:(it.firstMo||it.mo);
  var dueKm=kmI?base.km+kmI:null,dueDate=moI?addMonths(base.d,moI):null;
  var c=cur(),t=today(),r=rate();
  var remKm=dueKm!=null?dueKm-c.km:null;
  var dD=dueDate?days(t,dueDate):null;
  var dK=(remKm!=null&&r)?Math.round(remKm/r)-days(c.d,t):null;
  var eff=[dD,dK].filter(function(x){return x!=null});eff=eff.length?Math.min.apply(null,eff):null;
  var st=((remKm!=null&&remKm<=0)||(dD!=null&&dD<=0))?'bad':((remKm!=null&&remKm<=1500)||(eff!=null&&eff<=30))?'warn':'ok';
  var fk=kmI?(c.km-base.km)/kmI:0,ft=dueDate?days(base.d,t)/Math.max(1,days(base.d,dueDate)):0;
  return {last:last,dueKm:dueKm,dueDate:dueDate,remKm:remKm,dD:dD,dK:dK,eff:eff,st:st,pct:clamp(Math.max(fk,ft))};
}
function docStep(dc){var n=dc.inst||1;if(n>1)return Math.round((dc.renewMo||12)/n);return (dc.renewPlan&&dc.renewPlan.length)?dc.renewPlan[0]:(dc.renewMo||12)}
function docNext(dc){return addMonths(dc.until,docStep(dc))}
function docCompute(dc){
  var t=today(),dD=days(t,dc.until),st=dD<0?'bad':dD<=30?'warn':'ok';
  var ls=S.log.filter(function(l){return l.doc===dc.id}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var last=ls[ls.length-1],base=last?last.d:S.car.purchase;
  return {isDoc:true,dD:dD,eff:dD,st:st,dueDate:dc.until,dueKm:null,remKm:null,dK:null,last:last,pct:clamp(days(base,t)/Math.max(1,days(base,dc.until)))};
}
function allRows(){
  return S.items.map(function(it){return {it:it,x:compute(it)}})
   .concat(S.docs.map(function(dc){return {dc:dc,it:{id:'doc-'+dc.id,name:dc.name},x:docCompute(dc)}}))
   .sort(function(a,b){return RANK[a.x.st]-RANK[b.x.st]||(nz(a.x.eff)-nz(b.x.eff))});
}
function dueText(x){if(x.isDoc)return 'валидно до '+fmtD(x.dueDate);if(x.md)return x.dueDate?'до '+fmtD(x.dueDate)+' · към '+String(x.toSet||'').toLowerCase()+' гуми':'няма зададени дати';return [x.dueDate?'до '+fmtD(x.dueDate):null,x.dueKm!=null?'при '+fmtK(x.dueKm)+' км':null].filter(Boolean).join(' или ')}
function remText(x){
  var p=[];
  if(x.remKm!=null)p.push(x.remKm>0?'остават '+fmtK(x.remKm)+' км':'просрочено с '+fmtK(-x.remKm)+' км');
  if(x.dD!=null)p.push(x.dD>0?(x.isDoc?'остават ':'')+fmtDays(x.dD):x.dD===0?(x.isDoc?'изтича днес':'днес'):'просрочено с '+fmtDays(-x.dD));
  else if(x.dK!=null&&x.dK>0){var d=P(addDays(today(),x.dK));p.push('≈ '+MON[d.getMonth()]+' '+d.getFullYear())}
  return p.join(' · ');
}
function countdown(x){
  var useKm=x.remKm!=null&&(x.dD==null||(x.dK!=null&&x.dK<x.dD));
  if(useKm)return {n:fmtK(Math.abs(x.remKm)),u:x.remKm<=0?'км просрочено':'км остават'};
  if(x.dD!=null){var a=Math.abs(x.dD);return {n:String(a),u:(a===1?'ден':'дни')+(x.dD<0?' просрочено':' остават')}}

var APP_FOLDER='CarDiaryPersonal',DATA_NAME='car-diary.json',HIST_FOLDER='История на промените',PHOTO_FOLDER='Снимки',HIST_MAX=30;
var auth=(function(){try{return JSON.parse(localStorage.getItem('cd-auth'))||{}}catch(e){return {}}})();
var tokenClient=null,authWaiters=[];
function tokenValid(){return !!(auth.token&&Date.now()<auth.exp-60000)}
function saveAuth(){lsSet('cd-auth',JSON.stringify({token:auth.token,exp:auth.exp,email:auth.email,cal:!!auth.cal}))}
function authErr(){var e=new Error('Нужно е да влезете отново');e.code='auth';return e}
function gisReady(){return typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2}
function initGis(){
  if(tokenClient||!gisReady())return !!tokenClient;
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE_DRIVE+' '+SCOPE_EMAIL,callback:onToken,error_callback:function(e){ui.authBusy=false;ui.authMsg=(e&&e.type==='popup_closed')?'Входът беше прекъснат.':'Входът не мина'+(e&&e.message?': '+e.message:'.');render()}});
  return true;
}
function signIn(){
  if(!initGis()){ui.authMsg='Google вход не се зареди. Проверете интернет връзката и презаредете.';render();return}
  ui.authBusy=true;ui.authMsg='';render();
  var o={prompt:auth.email?'':'select_account'};if(auth.email)o.login_hint=auth.email;
  tokenClient.requestAccessToken(o);
}
function sha256hex(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function onToken(resp){
  if(!resp||resp.error){ui.authBusy=false;ui.authMsg='Входът не мина'+(resp&&resp.error?' ('+resp.error+')':'')+'.';render();return}
  if(!google.accounts.oauth2.hasGrantedAllScopes(resp,SCOPE_DRIVE,SCOPE_EMAIL)){ui.authBusy=false;ui.authMsg='Нужно е да разрешите и двата достъпа (Google Drive и имейл), за да работи книжката.';render();return}
  var tok=resp.access_token;
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json()}).then(function(u){
    var em=String(u&&u.email||'').trim().toLowerCase();
    return sha256hex(em).then(function(h){
      ui.authBusy=false;
      if(h!==OWNER_HASH){try{google.accounts.oauth2.revoke(tok,function(){})}catch(x){}auth={};lsSet('cd-auth','{}');ui.auth='denied';ui.authMsg='Акаунтът '+em+' няма достъп до тази книжка.';render();return}
      auth={token:tok,exp:Date.now()+(+resp.expires_in||3600)*1000,email:em,cal:google.accounts.oauth2.hasGrantedAllScopes(resp,SCOPE_CAL)};saveAuth();ui.auth='ok';ui.authMsg='';
      render();if(dirty)push();else pull();
    });
  }).catch(function(e){ui.authBusy=false;ui.authMsg='Неуспешна проверка на акаунта: '+errText(e);render()});
}
function signOut(){
  try{if(auth.token&&gisReady())google.accounts.oauth2.revoke(auth.token,function(){})}catch(e){}
  ['cd-auth','cd-ids','kq-data','kq-base','kq-dirty','kq-synced'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
  try{location.reload()}catch(e){}
}
function api(method,url,body,headers,asText){
  if(!tokenValid()){ui.auth='need';return Promise.reject(authErr())}
  var h=Object.assign({Authorization:'Bearer '+auth.token},headers||{});
  return fetch(url,{method:method,headers:h,body:body}).then(function(r){
    if(r.status===401){auth.token=null;saveAuth();ui.auth='need';throw authErr()}
    if(r.status===404){var e404=new Error('not found');e404.code=404;throw e404}
    if(!r.ok)return r.text().then(function(t){throw new Error('Google Drive '+r.status+(t?': '+t.slice(0,140):''))});
    if(r.status===204)return null;
    return asText?r.text():r.json();
  });
}
var DRV='https://www.googleapis.com/drive/v3/files',UPL='https://www.googleapis.com/upload/drive/v3/files';
var ids=(function(){try{return JSON.parse(localStorage.getItem('cd-ids'))||{}}catch(e){return {}}})();
function saveIds(){lsSet('cd-ids',JSON.stringify(ids))}
function qEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function findOne(name,parent,folder){
  var q="name='"+qEsc(name)+"' and trashed=false"+(parent?" and '"+parent+"' in parents":'')+(folder?" and mimeType='application/vnd.google-apps.folder'":" and mimeType!='application/vnd.google-apps.folder'");
  return api('GET',DRV+'?spaces=drive&pageSize=10&orderBy=modifiedTime desc&fields=files(id)&q='+encodeURIComponent(q)).then(function(r){return r.files&&r.files[0]?r.files[0].id:null});
}
function createFolder(name,parent){return api('POST',DRV+'?fields=id',JSON.stringify({name:name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined}),{'Content-Type':'application/json'}).then(function(r){return r.id})}
function appFolder(){if(ids.app)return Promise.resolve(ids.app);return findOne(APP_FOLDER,null,true).then(function(id){return id||createFolder(APP_FOLDER,null)}).then(function(id){ids.app=id;saveIds();return id})}
function subFolder(key,name){if(ids[key])return Promise.resolve(ids[key]);return appFolder().then(function(app){return findOne(name,app,true).then(function(id){return id||createFolder(name,app)})}).then(function(id){ids[key]=id;saveIds();return id})}
function multipart(meta,content,mime){
  var b='cd'+Math.random().toString(36).slice(2);
  var body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: '+mime+'\r\n\r\n'+content+'\r\n--'+b+'--';
  return {body:body,type:'multipart/related; boundary='+b};
}
function createFile(name,parent,content,mime,extra){
  var mp=multipart(Object.assign({name:name,parents:[parent]},extra||{}),content,mime||'application/json');
  return api('POST',UPL+'?uploadType=multipart&fields=id',mp.body,{'Content-Type':mp.type}).then(function(r){return r.id});
}
function dataFileId(){
  if(ids.data)return Promise.resolve(ids.data);
  return appFolder().then(function(app){return findOne(DATA_NAME,app,false)}).then(function(id){if(id){ids.data=id;saveIds()}return id});
}
function readData(){
  return dataFileId().then(function(id){
    if(!id)return null;
    return api('GET',DRV+'/'+id+'?alt=media',null,null,true).catch(function(e){if(e.code===404){delete ids.data;saveIds();return dataFileId().then(function(id2){return id2?api('GET',DRV+'/'+id2+'?alt=media',null,null,true):null})}throw e});
  });
}
function writeData(text){
  return dataFileId().then(function(id){
    if(id)return api('PATCH',UPL+'/'+id+'?uploadType=media&fields=id',text,{'Content-Type':'application/json'});
    return appFolder().then(function(app){return createFile(DATA_NAME,app,text)}).then(function(nid){ids.data=nid;saveIds()});
  });
}
function addHistory(prevText,msg){
  var prev=JSON.parse(prevText);if(prev.car)delete prev.car.photo;
  var at=new Date().toISOString();
  return subFolder('hist',HIST_FOLDER).then(function(hf){
    return createFile('v-'+at.replace(/[:.]/g,'-')+'.json',hf,JSON.stringify(prev),'application/json',{appProperties:{msg:String(msg||'Промяна').slice(0,110),at:at}}).then(function(){return hf});
  }).then(function(hf){
    api('GET',DRV+'?spaces=drive&pageSize=100&orderBy=createdTime desc&fields=files(id)&q='+encodeURIComponent("'"+hf+"' in parents and trashed=false")).then(function(r){
      (r.files||[]).slice(HIST_MAX).forEach(function(f){api('DELETE',DRV+'/'+f.id).catch(function(){})});
    }).catch(function(){});
  });
}
var API={
  loadData:function(){return readData()},
  saveData:function(json,base,msg){
    return readData().then(function(curText){
      var cur=curText?JSON.parse(curText):null,curV=(cur&&cur._v)||0;
      if(cur&&base!==curV)return {ok:false,data:curText};
      var d=JSON.parse(json);d._v=curV+1;d._saved=new Date().toISOString();
      var hp=curText?addHistory(curText,msg):Promise.resolve();
      return hp.then(function(){return writeData(JSON.stringify(d))}).then(function(){return {ok:true,v:d._v,saved:d._saved}});
    });
  },
  listVersions:function(){
    return subFolder('hist',HIST_FOLDER).then(function(hf){return api('GET',DRV+'?spaces=drive&pageSize='+HIST_MAX+'&orderBy=createdTime desc&fields=files(id,createdTime,appProperties)&q='+encodeURIComponent("'"+hf+"' in parents and trashed=false"))})
      .then(function(r){return (r.files||[]).map(function(f){var a=f.appProperties||{};return {id:f.id,at:a.at||f.createdTime,msg:a.msg||'Промяна'}})});
  },
  restoreVersion:function(id,base){
    return readData().then(function(curText){
      var cur=curText?JSON.parse(curText):null,curV=(cur&&cur._v)||0;
      if(cur&&base!==curV)return {ok:false,data:curText};
      return Promise.all([api('GET',DRV+'/'+id+'?alt=media',null,null,true),api('GET',DRV+'/'+id+'?fields=appProperties')]).then(function(rs){
        var d=JSON.parse(rs[0]),msg=(rs[1].appProperties||{}).msg||'промяна';
        if(cur&&cur.car&&cur.car.photo){d.car=d.car||{};d.car.photo=cur.car.photo}
        d._v=curV+1;d._saved=new Date().toISOString();var out=JSON.stringify(d);
        return (curText?addHistory(curText,'Върнато отпреди: '+msg):Promise.resolve()).then(function(){return writeData(out)}).then(function(){return {ok:true,v:d._v,data:out}});
      });
    });
  },
  savePhoto:function(dataUrl,name){
    var m=/^data:(image\/[\w+.-]+);base64,(.+)$/.exec(dataUrl||'');if(!m)return Promise.reject(new Error('Невалидна снимка'));
    return subFolder('photos',PHOTO_FOLDER).then(function(pf){
      var b='cd'+Math.random().toString(36).slice(2);
      var body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:String(name||'snimka.jpg').replace(/[\\/:*?"<>|]/g,'_'),parents:[pf]})+'\r\n--'+b+'\r\nContent-Type: '+m[1]+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+m[2]+'\r\n--'+b+'--';
      return api('POST',UPL+'?uploadType=multipart&fields=id',body,{'Content-Type':'multipart/related; boundary='+b}).then(function(r){return r.id});
    });
  }
};
function gs(){
  var ok=function(){},fail=function(){},r={withSuccessHandler:function(f){ok=f;return r},withFailureHandler:function(f){fail=f;return r}};
  Object.keys(API).forEach(function(n){r[n]=function(){var a=arguments;API[n].apply(null,a).catch(function(e){if(e&&e.code===404){ids={};saveIds();return API[n].apply(null,a)}throw e}).then(function(v){ok(v)},function(e){if(e&&e.code==='auth'){setSave('Влезте с Google, за да синхронизирате','warn');render()}fail(e)})}});
  return r;
}

function readImport(file){
  ui.importErr='';ui.importPreview=null;
  var rd=new FileReader();
  rd.onload=function(){
    var txt=String(rd.result||'').replace(/^\uFEFF/,'').trim(),d=null;
    try{d=JSON.parse(txt)}catch(e){ui.importErr='Файлът „'+file.name+'“ не е валиден JSON ('+(txt?txt.slice(0,30).replace(/\s+/g,' ')+'…':'празен файл')+'). Изберете kodiaq-servizna-knizhka.json.';render();return}
    if(Array.isArray(d)&&d.length&&typeof d[0].data==='string'){ui.importErr='Това е файлът с историята на промените („…-history.json“). Изберете другия файл: kodiaq-servizna-knizhka.json, без „history“ в името.';render();return}
    if(d&&typeof d.data==='string'){try{d=JSON.parse(d.data)}catch(e){}}
    if(!d||typeof d!=='object'||!Array.isArray(d.items)){ui.importErr='Файлът „'+file.name+'“ не съдържа сервизна книжка (липсват позициите за обслужване). Изберете kodiaq-servizna-knizhka.json.';render();return}
    if(!Array.isArray(d.log))d.log=[];
    ui.importPreview={name:file.name,data:d};render();
  };
  rd.onerror=function(){ui.importErr='Файлът не може да бъде прочетен.';render()};
  rd.readAsText(file);
}

function processCar(file){return new Promise(function(res,rej){

  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Неподдържан формат'))};img.src=url;
})}

// ---------- Push известия ----------
var VAPID_PUB='__VAPID_PUB__';
var NOTIFY_DAYS_ALL=[30,14,7,3,1,0];
function notifyDays(){var d=S.notify&&S.notify.days;return Array.isArray(d)?d:[30,7,3,1,0]}
function pushKeyReady(){return /^[A-Za-z0-9_-]{80,}$/.test(VAPID_PUB)}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function b64uToBytes(s){var p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function swReg(){return navigator.serviceWorker.getRegistration().then(function(r){return r||navigator.serviceWorker.register('sw.js')}).then(function(){return navigator.serviceWorker.ready})}
function refreshPush(){
  if(!pushSupported()){ui.push={supported:false};render();return}
  swReg().then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    ui.push={supported:true,perm:Notification.permission,sub:sub?JSON.stringify(sub):null};render();
  }).catch(function(e){ui.push={supported:true,perm:Notification.permission,err:errText(e)};render()});
}
function enablePush(){
  if(!pushSupported())return;
  ui.pushBusy=true;render();
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){ui.pushBusy=false;ui.push={supported:true,perm:p};render();return}
    return swReg().then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUB)})})})
      .then(function(sub){ui.pushBusy=false;ui.push={supported:true,perm:'granted',sub:JSON.stringify(sub)};writeDueCache(true);render();toast('Известията са включени на това устройство',false,5000)});
  }).catch(function(e){ui.pushBusy=false;ui.push=Object.assign({},ui.push,{err:errText(e)});render()});
}
function disablePush(){
  swReg().then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){return s&&s.unsubscribe()}).then(function(){refreshPush();toast('Известията са изключени на това устройство',false,4000)});
}
function testNotification(){
  swReg().then(function(reg){
    var sn=dueSnapshot(),soon=sn.items.filter(function(i){return i.d&&days(today(),i.d)<=30}).length;
    return reg.showNotification('Car Diary · тест',{body:'Известията на това устройство работят.'+(soon?' В следващите 30 дни: '+soon+' позиции.':''),icon:'icons/icon-192.png',badge:'icons/badge-72.png',tag:'car-diary-test',data:{url:location.href.split('#')[0]}});
  }).catch(function(e){toast('Тестът не мина: '+errText(e),false,5000)});
}
function dueSnapshot(){
  var c=cur(),items=[];
  S.items.forEach(function(it){var x=compute(it);if(x.dueDate||x.dueKm!=null)items.push({k:it.id,n:it.name,d:x.dueDate||null,km:x.dueKm!=null?x.dueKm:null})});
  S.docs.forEach(function(dc){items.push({k:'doc-'+dc.id,n:dc.name,d:dc.until,km:null})});
  if(typeof apptDueItems==='function')apptDueItems().forEach(function(a){items.push(a)});
  return {v:1,km:c.km,kmDate:c.d,rate:rate()||0,days:notifyDays(),overdueEvery:3,kmMarks:[1500,500,0],url:location.href.split('#')[0].split('?')[0],items:items};
}
var lastDue='',dueTimer=null;
function writeDueCache(force){
  if(!('caches' in window))return;
  clearTimeout(dueTimer);
  dueTimer=setTimeout(function(){
    try{var js=JSON.stringify(dueSnapshot());if(!force&&js===lastDue)return;lastDue=js;
      caches.open('cd-notify').then(function(c){return c.put('due.json',new Response(js,{headers:{'Content-Type':'application/json'}}))}).catch(function(){});
      if(typeof publishPlan==='function')publishPlan();
    }catch(e){}
  },force?0:800);
}
function notifySettingsHTML(){
  var p=ui.push,h='<section><h2>Известия</h2><div class="box">';
  if(!p){h+='<p class="muted small">Проверка…</p></div></section>';return h}
  if(!p.supported)return h+'<p class="foot">Този браузър не поддържа известия. На Android ползвайте инсталираното приложение или Chrome.</p></div></section>';
  if(!pushKeyReady())return h+'<p class="foot">Известията още не са настроени: в GitHub липсва променливата <b>VAPID_PUBLIC_KEY</b>. След като я добавите, публикуването ще я вгради автоматично.</p></div></section>';
  var on=p.perm==='granted'&&p.sub;
  h+='<div class="ntf-st'+(on?' on':'')+'"><span class="dot"></span><b>'+(on?'Включени на това устройство':p.perm==='denied'?'Блокирани в настройките на браузъра':'Изключени на това устройство')+'</b></div>';
  if(p.perm==='denied')h+='<p class="foot">Разрешете известията за сайта от настройките на браузъра или на приложението (Android: Настройки → Приложения → Car Diary → Известия) и опитайте отново.</p>';
  h+='<div class="actions">'+(on?'<button class="btn" data-act="push-off">Изключи</button><button class="btn" data-act="push-test">Тестово известие</button>':'<button class="btn primary" data-act="push-on"'+(ui.pushBusy||p.perm==='denied'?' disabled':'')+'>'+(ui.pushBusy?'Включване…':'Включи известия на това устройство')+'</button>')+'</div>';
  if(p.err)h+='<p class="err">'+esc(p.err)+'</p>';
  var dd=notifyDays();
  h+='<div class="f"><span>Напомняй преди срока</span><div class="chips">'+NOTIFY_DAYS_ALL.map(function(d){return '<label class="chk"><input type="checkbox" class="ntf-day" value="'+d+'"'+(dd.indexOf(d)>=0?' checked':'')+'><span>'+(d===0?'в деня':d===1?'1 ден':d+' дни')+'</span></label>'}).join('')+'</div><p class="foot">Плюс при 1 500 и 500 км преди обслужване по километри, и на всеки 3 дни при просрочено. Проверката е всеки ден около 11:00. Настройката важи за всички устройства.</p></div>';
  if(on){
    h+='<details class="imp-det"'+(ui.pushCodeOpen?' open':'')+'><summary>Свързване с GitHub (еднократно за всяко устройство)</summary><ol class="steps"><li>Копирайте кода на това устройство.</li><li>Отворете <b>github.com → вашето репо → Settings → Secrets and variables → Actions</b>.</li><li>Отворете (или създайте) <b>PUSH_SUBSCRIPTIONS</b> и поставете кода <b>на нов ред</b> под кодовете на другите устройства.</li></ol><textarea id="push-code" rows="4" readonly>'+esc(p.sub)+'</textarea><div class="actions"><button class="btn primary" data-act="push-copy">Копирай кода</button></div><p class="foot">Кодът е само адрес за доставяне на известия до това устройство. В него няма данни от книжката.</p></details>';
  }
  return h+'</div></section>';
}

function noteCard(n){
  var reps=(n.replies||[]).slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.id<b.id?-1:1)}),done=!!n.done;

// ---------- Google Календар ----------
var calClient=null,calWait=null;
function calReady(){return !!(auth&&auth.cal&&tokenValid())}
function ensureCal(cb){
  if(calReady()){cb(null);return}
  if(!gisReady()){cb(new Error('Google вход не се зареди'));return}
  if(!calClient)calClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE_CAL,include_granted_scopes:true,callback:function(resp){
      var w=calWait;calWait=null;if(!w)return;
      if(!resp||resp.error||!google.accounts.oauth2.hasGrantedAllScopes(resp,SCOPE_CAL)){w(new Error('Не беше разрешен достъп до календара'));return}
      var tok=resp.access_token;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json()}).then(function(u){
        return sha256hex(String(u&&u.email||'').trim().toLowerCase()).then(function(h){
          if(h!==OWNER_HASH){w(new Error('Избран е друг акаунт'));return}
          auth.token=tok;auth.exp=Date.now()+(+resp.expires_in||3600)*1000;auth.cal=true;saveAuth();ui.auth='ok';w(null);
        });
      }).catch(function(e){w(e)});
    },error_callback:function(e){var w=calWait;calWait=null;if(w)w(new Error(e&&e.type==='popup_closed'?'Прозорецът за разрешение беше затворен':'Разрешението не мина'))}});
  calWait=cb;
  calClient.requestAccessToken({prompt:'',login_hint:auth.email||undefined});
}
function calApi(method,path,body){
  return fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events'+path,{method:method,headers:{Authorization:'Bearer '+auth.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===204||(method==='DELETE'&&(r.status===404||r.status===410)))return null;
    if(r.status===401){auth.cal=false;saveAuth();throw new Error('Достъпът до календара изтече, опитайте пак')}
    return r.json().then(function(j){
      if(!r.ok){var m=(j&&j.error&&j.error.message)||('HTTP '+r.status);var e=new Error(/has not been used|is disabled|accessNotConfigured/i.test(m)?'Google Calendar API не е включен в проекта CarDiaryPersonal':m);e.code=r.status;e.api=/has not been used|is disabled|accessNotConfigured/i.test(m);throw e}
      return j;
    });
  });
}
function addMin(d,t,min){var p=d.split('-'),hm=t.split(':'),x=new Date(+p[0],p[1]-1,+p[2],+hm[0],+hm[1]+min);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())+'T'+pad(x.getHours())+':'+pad(x.getMinutes())+':00'}
function calEvent(a){
  var tz='Europe/Sofia';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}

// ---------- Километраж от MyŠkoda (чрез криптиран файл, който GitHub Actions обновява веднъж на нощ) ----------
// Приложението никога не говори със Škoda – чете само odo.json от клона odo-data и го разшифрова с паролата.
function odoUrl(){
  var o=lsGet('cd-odo-url');if(o)return o;
  var hm=String(location.hostname||'').match(/^([^.]+)\.github\.io$/),seg=String(location.pathname||'').split('/').filter(Boolean)[0];
  if(!hm)return null;
  return 'https://raw.githubusercontent.com/'+hm[1]+'/'+(seg||hm[1]+'.github.io')+'/odo-data/odo.json';
}
function odoPass(){return lsGet('cd-odo-pass')||''}
function odoLast(){try{return JSON.parse(lsGet('cd-odo-last')||'null')}catch(e){return null}}
function b64ToBytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function odoDecrypt(file,pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(file.salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(file.iv)},key,b64ToBytes(file.ct))})
    .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))},function(){var e=new Error('Паролата не съвпада с ODO_SECRET в GitHub');e.code='pass';throw e});
}
function odoLocalDate(iso){var d=new Date(iso);if(isNaN(d))return today();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function odoSwConfig(){
  if(!('caches' in window))return;
  try{var pw=odoPass(),u=odoUrl();caches.open('cd-notify').then(function(c){return pw&&u?c.put('odo-cfg.json',new Response(JSON.stringify({url:u,pass:pw}),{headers:{'Content-Type':'application/json'}})):c.delete('odo-cfg.json')}).catch(function(){})}catch(e){}
}
var odoBusy=false;
function odoFetch(){
  var pw=odoPass(),u=odoUrl();if(!pw||!u)return Promise.reject(new Error('MyŠkoda не е свързана – Настройки → Километраж от MyŠkoda'));
  var src=ghToken()&&ghRepo()?gh('GET','/contents/odo.json?ref=odo-data').then(function(j){return typeof j==='string'?JSON.parse(j):j},function(e){if(e.code==='gh')return fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()});throw e})
    :fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(r.status===404){var e=new Error('Още няма данни – пуснете веднъж „Километраж от MyŠkoda“ в GitHub → Actions → Run workflow.');e.code=404;throw e}
      if(!r.ok)throw new Error('GitHub върна '+r.status);
      return r.json();
    });
  return src.then(function(file){return odoDecrypt(file,pw)}).then(function(p){lsSet('cd-odo-check',String(Date.now()));lsSet('cd-odo-last',JSON.stringify(p));return p});
}
function odoCheck(force){
  var pw=odoPass(),u=odoUrl();if(!pw||!u||odoBusy)return Promise.resolve(null);
  if(!force&&Date.now()-(+lsGet('cd-odo-check')||0)<6*36e5)return Promise.resolve(null);
  if(ui.auth!=='ok'||ui.onboard)return Promise.resolve(null);
  odoBusy=true;ui.odoErr='';if(force)render();
  return odoFetch().then(function(p){
    odoBusy=false;
    var added=odoApply(p,force);if(!added)render();return p;
  }).catch(function(e){odoBusy=false;lsSet('cd-odo-check',String(Date.now()));ui.odoErr=errText(e);render();if(force)toast(ui.odoErr,false,7000);return null});
}
function odoApply(p,force){
  if(!p||typeof p.km!=='number')return false;
  var c=cur(),d=odoLocalDate(p.at);
  if(p.km<c.km&&odoHigher(p.km).length){if(force)toast('MyŠkoda показва '+fmtK(p.km)+' км – по-малко от въведените '+fmtK(c.km)+' км. Вижте предложението за корекция.',false,7000);return false}
  if(p.km<=c.km){if(force)toast('Километражът е актуален: '+fmtK(c.km)+' км',false,4000);return false}
  if(d<c.d)d=c.d;
  var dd=Math.max(1,days(c.d,d));
  if((p.km-c.km)/dd>3000){ui.odoErr='MyŠkoda отчете '+fmtK(p.km)+' км – твърде голям скок, не е добавено автоматично.';return false}
  if(S.readings.some(function(r){return r.d===d&&r.km===p.km}))return false;
  act('Километраж от MyŠkoda: '+fmtK(p.km)+' км',function(){S.readings.push({d:d,km:p.km,src:'skoda'})});
  return true;
}

function odoHigher(km){return S.readings.filter(function(r){return r.km>km&&r.src!=='visit'})}
function odoAcceptKm(km,d){

    S.readings=S.readings.filter(function(r){return !(r.km>km&&r.src!=='visit')});
    if(!S.readings.some(function(r){return r.d===d&&r.km===km}))S.readings.push({d:d,km:km,src:'skoda'});
  });
  if(cur().km>km)toast('Има посещение в сервиза с по-голям километраж ('+fmtK(cur().km)+' км) – проверете го в „Сервиз“.',false,8000);
}
function odoMismatch(){

// ---------- План за известия: в кои дни телефонът ще има нещо НОВО за показване ----------
// Сигнал от GitHub се праща само в тези дни, иначе Chrome показва „This site has been updated in the background“.
// Логиката е същата като в service worker-а (sw.js → dueToday), без състоянието „изпратено“ на устройството.
function planYmd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function planParse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function planDays(a,b){return Math.round((planParse(b)-planParse(a))/864e5)}
function planStep(it,day,sn){
  var dLeft=it.d?planDays(day,it.d):null;
  if(it.appt){
    if(dLeft==null||dLeft<0)return null;
    var ad=(it.days||[3,1,0]).slice().sort(function(a,b){return a-b}).find(function(x){return dLeft<=x});
    return ad===undefined?null:it.k+'@'+it.d+' '+(it.t||'')+'#a'+ad;
  }
  var days=(sn.days||[30,7,3,1,0]).slice().sort(function(a,b){return a-b}),marks=(sn.kmMarks||[1500,500,0]).slice().sort(function(a,b){return a-b});
  var kmNow=sn.km+(sn.rate||0)*Math.max(0,planDays(sn.kmDate,day)),kmLeft=it.km!=null?it.km-kmNow:null,step=null;
  var over=(dLeft!=null&&dLeft<0)||(kmLeft!=null&&kmLeft<=0);
  if(over){var since=dLeft!=null&&dLeft<0?-dLeft:0;step='over'+Math.floor(since/(sn.overdueEvery||3))}
  else{
    var dS=dLeft!=null?days.find(function(x){return dLeft<=x}):undefined,kS=kmLeft!=null?marks.find(function(x){return kmLeft<=x}):undefined;
    if(dS!==undefined)step='d'+dS;
    if(kS!==undefined&&(step===null||kmLeft<=1500))step=(step?step+'|':'')+'k'+kS;
  }
  return step?it.k+'@'+(it.d||'')+'/'+(it.km!=null?it.km:'')+'#'+step:null;
}
// Дните (до 120 напред), в които поне една позиция минава на ново „стъпало“.
function notifyPlan(){
  var sn=dueSnapshot(),t=new Date(),out=[];
  for(var i=0;i<=120;i++){
    var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i),day=planYmd(d),prev=planYmd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-1));
    if(sn.items.some(function(it){var s=planStep(it,day,sn);return s&&s!==planStep(it,prev,sn)}))out.push(day);
  }
  return {v:1,from:planYmd(t),until:planYmd(new Date(t.getFullYear(),t.getMonth(),t.getDate()+120)),days:out};
}
function odoEncrypt(obj,pass){
  var enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));

    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  }).then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(obj)))})
    .then(function(ct){return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})});
}
var planTimer=null,planBusy=false;
// Публикува плана, когато се промени (или веднъж седмично). Нужни са паролата ODO_SECRET и GitHub токенът.
function publishPlan(force){
  if(!ghToken()||!odoPass()||!ghRepo()||ui.auth!=='ok'||ui.onboard)return;
  clearTimeout(planTimer);
  planTimer=setTimeout(function(){
    if(planBusy)return;
    var p;try{p=notifyPlan()}catch(e){return}
    var sig=JSON.stringify(p.days),last=lsGet('cd-plan-sig'),at=+lsGet('cd-plan-at')||0;
    if(!force&&sig===last&&Date.now()-at<7*864e5)return;
    planBusy=true;
    odoEncrypt(p,odoPass()).then(function(blob){
      return gh('POST','/actions/workflows/notify-plan.yml/dispatches',{ref:'main',inputs:{plan:blob}});
    }).then(function(){planBusy=false;lsSet('cd-plan-sig',sig);lsSet('cd-plan-at',String(Date.now()))},function(){planBusy=false});

function kmIssue(d,km,skip){
  if(isNaN(km)||km<0||km>2000000)return {hard:true,msg:'Невалиден километраж.'};
  if(d>today())return {hard:true,msg:'Датата е в бъдещето.'};
  var rs=sortedReadings().filter(function(r){return !(skip&&r.d===skip.d&&r.km===skip.km)}),prev=null,next=null;
  rs.forEach(function(r){if(r.d<=d)prev=r;else if(!next)next=r});
  if(prev&&km<prev.km)return {msg:'Това е по-малко от '+fmtK(prev.km)+' км, отчетени на '+fmtD(prev.d)+'.'};
  if(next&&km>next.km)return {msg:'Това е повече от '+fmtK(next.km)+' км, отчетени по-късно, на '+fmtD(next.d)+'.'};
  if(prev){var dd=Math.max(1,days(prev.d,d)),diff=km-prev.km;if(diff>1200*dd||diff>20000&&dd<60)return {msg:'Това са '+fmtK(diff)+' км за '+fmtDays(dd)+' от предишното отчитане ('+fmtK(prev.km)+' км). Проверете за излишна цифра.'}}
  return null;
}
function kmGate(f,errId,d,km,skip){

}

    act('Записката е добавена',function(){var n={id:uid(),d:nd,text:nt};if(!isNaN(nk))n.km=nk;if(npin)n.pin=true;S.notes.push(n)});return}
  if(k==='appt'){submitAppt(f);return}
  if(k==='odo-pass'){odoSubmit();return}
  if(k==='gh-token'){var gtv=(document.getElementById('gh-token')||{}).value||'';gtv=gtv.trim();if(!gtv)return;lsSet('cd-gh-token',gtv);ui.odoSetup=false;render();publishPlan(true);toast('Токенът е запазен – натиснете синхронизация',false,5000);return}
  if(k==='reply-add'){
    var rid=f.getAttribute('data-id'),rt=val('r-text').trim();if(!rt)return;var rkm=cur().km;
    ui.replyTo=null;act('Коментарът е добавен',function(){var rn=S.notes.find(function(n){return n.id===rid});if(!rn)return;(rn.replies=rn.replies||[]).push({id:uid(),d:today(),km:rkm,text:rt})});return}
  if(k==='note-save'){
    var en=S.notes.find(function(n){return n.id===f.getAttribute('data-id')});if(!en)return;var et=val('ne-text').trim();if(!et)return;var ed=val('ne-date')||en.d,ek=parseInt(val('ne-km'),10);
    ui.editNote=null;act('Записката е запазена',function(){en.text=et;en.d=ed;if(isNaN(ek))delete en.km;else en.km=ek});return}
  if(k==='visit'){
    var ids=Array.prototype.map.call(f.querySelectorAll('input[name=vi]:checked'),function(i){return i.value});
    if(!ids.length){var ve=document.getElementById('v-err');if(ve){ve.textContent='Изберете поне една позиция.';ve.hidden=false}return}
    var d=val('v-date'),km=parseInt(val('v-km'),10);if(!d||isNaN(km))return;
    var edOrig=ui.sheet&&ui.sheet.edit?visitGroup(ui.sheet.edit):null;if(!kmGate(f,'v-err',d,km,edOrig?{d:edOrig.d,km:edOrig.km}:null))return;
    var cost=parseFloat(val('v-cost')),note=val('v-note').trim(),det=val('v-details').trim(),editK=ui.sheet&&ui.sheet.edit,vid=editK||uid();
    var photos=(ui.sheet&&ui.sheet.photos)||[],pend=photos.filter(function(p){return !p.id&&p.full}),GSr=gs();
    var apId=ui.sheet&&ui.sheet.appt;
    var sbtn=f.querySelector('button[type=submit]');
    function finish(){
      act(editK?'Посещението е обновено':'Записано: '+ids.length+(ids.length===1?' позиция':' позиции'),function(){
        if(editK)S.log=S.log.filter(function(e){return (e.v||e.id)!==editK});
        ids.forEach(function(id,i){var it=findItem(id);var en={id:vid+'-'+i,v:vid,item:id,name:it?it.name:'',d:d,km:km};if(i===0){if(note)en.note=note;if(det)en.details=det;if(cost>0)en.cost=Math.round(cost*100)/100;if(photos.length)en.photos=photos.map(function(p){return p.id?{id:p.id,t:p.t}:{t:p.t}})}S.log.push(en)});
        if(km>cur().km)S.readings.push({d:d,km:km,src:'visit'});
        if(apId){var apD=(S.appts||[]).find(function(x){return x.id===apId});if(apD)apD.done=vid}
      });
    }
    if(!pend.length||!GSr){if(pend.length)toast('Без връзка с Google: пазя само умалени снимки',false,4000);pend.forEach(function(p){delete p.full});finish();return}
    var done=0;if(sbtn){sbtn.disabled=true;sbtn.textContent='Качване на снимки 0/'+pend.length}
    (function next(){
      if(done>=pend.length){finish();return}
      var p=pend[done];
      gs().withSuccessHandler(function(id){p.id=id;delete p.full;done++;if(sbtn)sbtn.textContent='Качване на снимки '+done+'/'+pend.length;next()})
          .withFailureHandler(function(e){toast('Снимка не се качи ('+errText(e)+'). Пазя умалено копие.',false,5000);delete p.full;done++;next()})
          .savePhoto(p.full,d+'_'+p.n);
    })();
    return}
  if(k==='pay'){
    var dc=findDoc(f.getAttribute('data-id'));if(!dc)return;
    var pd=val('p-date'),pu=val('p-until');if(!pd||!pu)return;
    var pc=parseFloat(val('p-cost')),pn=val('p-note').trim(),isNew=f.getAttribute('data-new')==='1';
    var nAmts=Array.prototype.map.call(f.querySelectorAll('.pp-amt'),function(i){return Math.round((parseFloat(i.value)||0)*100)/100}),nTot=parseFloat(val('pp-total-in')),nInst=parseInt(val('pp-inst'),10)||1,nIns=val('pp-ins').trim(),nVal=parseFloat(val('pp-value'));
    var n=isNew?nInst:(dc.inst||1),ni=isNew?1:(dc.nextInst||1);
    act(isNew?dc.name+': новата полица е записана':(n>1?dc.name+': вноска '+ni+'/'+n+' е записана':dc.name+': подновено до '+fmtD(pu)),function(){
      var oldUntil=dc.until;
      if(isNew){
        if(nTot>0)dc.annual=Math.round(nTot*100)/100;
        if(n>1)dc.inst=n;else delete dc.inst;
        if(n>1&&nAmts.length===n)dc.instAmounts=nAmts;else delete dc.instAmounts;
        dc.insurer=nIns;if(nVal>0)dc.carValue=Math.round(nVal*100)/100;
        dc.policies=dc.policies||[];var pf=addDays(oldUntil,1);
        dc.policies.push({from:pf,to:addDays(addMonths(pf,dc.renewMo||12),-1),total:dc.annual||0,inst:n,amounts:dc.instAmounts||null,insurer:nIns,value:dc.carValue||null});
        delete dc.awaiting;
      }
      var en={id:uid(),doc:dc.id,name:dc.name,d:pd,until:pu};if(pc>0)en.cost=Math.round(pc*100)/100;if(pn)en.note=pn;if(n>1)en.inst=ni+'/'+n;if(isNew&&nIns)en.insurer=nIns;
      S.log.push(en);dc.until=pu;
      if(n>1){dc.nextInst=ni%n+1;if(ni===n)dc.awaiting=true}
      else{dc.nextInst=1;if(dc.id==='ins'||dc.insurer!=null)dc.awaiting=true;else if(dc.renewPlan&&dc.renewPlan.length)dc.renewPlan.shift()}
    });return}
  if(k==='tyre-add'){
    var tt=val('ty-type'),tb=val('ty-brand').trim(),ts=val('ty-size').trim(),td=val('ty-date'),tdot=val('ty-dot').trim(),tc=parseFloat(val('ty-cost')),trep=document.getElementById('ty-repl').checked;
    if(!td)return;
    act('Добавени: '+tt.toLowerCase()+' гуми'+(tb?' '+tb:''),function(){
      var set={id:'t'+uid(),type:tt,bought:td};if(tb)set.brand=tb;if(ts)set.size=ts;if(tdot)set.dot=tdot;if(tc>0)set.cost=Math.round(tc*100)/100;
      if(trep)S.tyres.sets.forEach(function(x){if(!x.retired&&x.type===tt)x.retired=td});
      S.tyres.sets.push(set);
      var en={id:uid(),tyre:set.id,name:'Нови гуми: '+tt.toLowerCase()+(tb?' · '+tb:''),d:td};if(set.cost)en.cost=set.cost;S.log.push(en);
    });return}
  if(k==='photo-view'){var nv=ui.sheet.v;act('Изгледът на снимката е запазен',function(){if(nv.z===1&&nv.x===50&&nv.y===50)delete S.car.photoView;else S.car.photoView={z:nv.z,x:nv.x,y:nv.y}});return}
  if(k==='odo'){var od=val('o-date'),ok=parseInt(val('o-km'),10);if(!od||isNaN(ok))return;if(f.getAttribute('data-skoda')===ok+'|'+od||(ui.sheet&&ui.sheet.odo&&ui.sheet.odo.filled===ok&&ui.sheet.odo.d===od)){odoAcceptKm(ok,od);return}if(!kmGate(f,'o-err',od,ok))return;act('Километражът е обновен: '+fmtK(ok)+' км',function(){S.readings.push({d:od,km:ok})});return}
  if(k==='add'){
    var nm=val('a-name').trim(),akm=parseInt(val('a-km'),10),amo=parseInt(val('a-mo'),10);if(!nm)return;
    act('Добавено: '+nm,function(){var ni2={id:'c'+uid(),name:nm,g:val('a-g')};if(akm>0)ni2.km=akm;if(amo>0)ni2.mo=amo;if(!ni2.km&&!ni2.mo)ni2.mo=12;S.items.push(ni2)});return}
  if(k==='adddoc'){
    var dn=val('d-name').trim(),du=val('d-until'),dm=parseInt(val('d-mo'),10);if(!dn||!du)return;
    act('Добавено: '+dn,function(){S.docs.push({id:'d'+uid(),name:dn,until:du,renewMo:dm>0?dm:12})});return}
}
render();
var pending=ssGet('kq-undo');
if(pending&&Date.now()-pending.t<12000)toast(pending.msg,true,Math.max(3000,12000-(Date.now()-pending.t)));
ui.auth=tokenValid()?'ok':'need';render();
if(ui.auth==='ok'){setSave(dirty?'Изпращане на промени от това устройство…':'Зареждане…');pull()}else setSave('Влезте с Google, за да синхронизирате','warn');
(function waitGis(n){if(gisReady())initGis();else if(n<60)setTimeout(function(){waitGis(n+1)},250)})(0);
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
odoSwConfig();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&tokenValid()&&!ui.onboard){if(dirty)push();else pull()}});
window.addEventListener('online',function(){if(tokenValid()&&!ui.onboard){if(dirty)push();else pull()}});

})();
</script>
